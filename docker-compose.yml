services:
  codebase-profiler:
    build: .
    ports:
      - "${UI_PORT:-8766}:8766"
    environment:
      EXTRACT_UI_DOCKER: "1"
      DEFAULT_LOCAL_REPOS_DIR: /data/repos
      DEFAULT_HG_REPOS_DIR: /data/hg-repos
      DEFAULT_P4_WORKSPACES_DIR: /data/p4-workspaces
      DEFAULT_SVN_WORKINGCOPIES_DIR: /data/svn-workingcopies
      DEFAULT_TOKENS_FILE: /app/secrets/tokens
      HOST_OUTPUT_HINT: ./outputs/raw-extracts
      PYTHONUNBUFFERED: "1"
      DUPLICATE_THRESHOLD_PCT: ${DUPLICATE_THRESHOLD_PCT:-25}
      # Large / binary-heavy repos (e.g. Unity) time out on the per-commit
      # `git log --numstat` over a bind mount. Longer limit + cap per-file
      # detail to the most recent N commits (totals/authors/dates stay exact).
      EXTRACT_GIT_LOG_TIMEOUT: ${EXTRACT_GIT_LOG_TIMEOUT:-3600}
      EXTRACT_COMMIT_DETAIL_LIMIT: ${EXTRACT_COMMIT_DETAIL_LIMIT:-5000}
    volumes:
      # Mount the directory, not the file: a single-file bind mount pins one
      # inode, so if the host tokens file is created or replaced after the
      # container starts, stat() keeps succeeding while open() returns ENOENT.
      - ./secrets:/app/secrets:ro
      - ./outputs:/app/outputs
      - ${LOCAL_REPOS_DIR:-./repos}:/data/repos:ro
      - ${LOCAL_HG_REPOS_DIR:-./hg-repos}:/data/hg-repos:ro
      - ${LOCAL_P4_WORKSPACES_DIR:-./p4-workspaces}:/data/p4-workspaces:ro
      - ${LOCAL_SVN_WORKINGCOPIES_DIR:-./svn-workingcopies}:/data/svn-workingcopies:ro
    restart: unless-stopped
